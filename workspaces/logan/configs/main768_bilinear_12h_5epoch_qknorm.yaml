name: main768_bilinear_12h_5epoch_qknorm
seed: 42

model:
  vocab_size: 4096
  n_ctx: 512
  d_model: 768
  n_head: 12
  n_layers: 2
  attn_type: bilinear
  attn_scale: 1.0
  rope_base: 10000
  norm_type: layernorm
  norm_place: pre_unembed
  use_rmsnorm_qk: true
  use_bias_qkv: true
  use_bias_o: true

init:
  std_embed: 0.02
  std_qkv: 0.02
  std_o: 0.01

train:
  batch_size: 32
  lr: 3.0e-4
  muon_lr: 0.02
  use_muon: true
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_steps: 330580
  warmup_steps: 2000
  lr_decay_frac: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  debug: true
  eval_every: 10000
  save_every: 66116

loss:
  type: next_token_ce
  label_smoothing: 0.0
