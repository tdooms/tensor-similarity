init:
  init_type: mup
  std_embed: 0.02
  std_o: 0.01
  std_qkv: 0.02
loss:
  label_smoothing: 0.0
  type: next_token_ce
model:
  attn_scale: 0.35
  attn_type: quadratic
  d_model: 8
  n_ctx: 8
  n_head: 2
  n_layers: 2
  norm_places: []
  norm_type: none
  rope_base: 1000
  use_bias_qk: false
  use_rmsnorm_qk: false
  vocab_size: 8
name: mini_induction_checkpoints
seed: 42
train:
  batch_size: 64
  betas:
  - 0.9
  - 0.95
  checkpoint_every: 500
  debug: true
  dtype: bfloat16
  eval_every: 100
  grad_clip: 1.0
  lr: 0.0003
  lr_decay_frac: 0.2
  max_steps: 15000
  muon_lr: 0.02
  use_muon: true
  warmup_steps: 500
  weight_decay: 0.1
