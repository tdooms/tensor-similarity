name: norm_sweep_stories
seed: 42

model:
  vocab_size: 4096
  n_ctx: 256
  d_model: 128
  n_head: 4
  n_layers: 2
  attn_type: bilinear
  attn_scale: 0.35
  rope_base: 10000
  norm_type: seq_max  # override with --norm-type CLI arg
  norm_places: [pre_layer, pre_unembed]
  use_rmsnorm_qk: false
  use_bias_qk: true
  norm_kwargs: {}

init:
  std_embed: 0.02
  std_qkv: 0.02
  std_o: 0.01
  init_type: normal

train:
  batch_size: 64
  lr: 3.0e-4
  muon_lr: 0.02
  use_muon: true
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_steps: 5000  # longer for stories
  warmup_steps: 200
  lr_decay_frac: 0.1
  grad_clip: 1.0
  dtype: bfloat16
  eval_every: 200
  checkpoint_every: 1000

loss:
  type: next_token_ce
  label_smoothing: 0.0
