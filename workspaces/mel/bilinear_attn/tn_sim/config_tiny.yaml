name: tiny_tn_sim
seed: 42

model:
  vocab_size: 64
  n_ctx: 16
  d_model: 16
  n_head: 4
  n_layers: 2
  attn_type: bilinear
  attn_scale: 0.35
  rope_base: 10000
  norm_type: rmsnorm
  norm_places: [pre_unembed]
  use_rmsnorm_qk: false
  use_bias_qk: true

init:
  init_type: mup
  std_embed: 0.02

train:
  batch_size: 64
  lr: 3.0e-4
  muon_lr: 0.02
  use_muon: false
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_steps: 10000
  warmup_steps: 50
  lr_decay_frac: 0.1
  grad_clip: 1.0
  dtype: float32
  eval_every: 500
  checkpoint_every: 1000

loss:
  type: next_token_ce
  label_smoothing: 0.0
