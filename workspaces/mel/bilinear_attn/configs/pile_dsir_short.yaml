name: pile_short
seed: 42

data:
  name: pile_dsir
  repo: stanford-crfm/DSIR-filtered-pile-50M
  revision: 2b07626eba22fbb8ac936faa385767e06cba6593
  tokenizer: tokenizers/pile_dsir_4096
  text_field: contents
  train_split: train
  val_split: heldout
  holdout_fraction: 0.01
  holdout_seed: 42
  insert_eos_between_documents: true
  train_shuffle: true
  train_shuffle_seed: 42
  train_shuffle_buffer_size: 10000
  val_cache_size: 200

model:
  vocab_size: 4096
  n_ctx: 512
  d_model: 256
  n_head: 8
  n_layers: 2
  attn_type: bilinear
  attn_scale: 0.35
  rope_base: 10000
  norm_type: none
  norm_places: []
  use_rmsnorm_qk: false
  use_bias_qk: true

init:
  std_embed: 0.02
  std_qkv: 0.02
  std_o: 0.01
  init_type: mup

train:
  batch_size: 64
  lr: 3.0e-4
  lr_decay_frac: 0.1
  use_muon: true
  muon_lr: 0.02
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_steps: 200
  warmup_steps: 50
  grad_clip: 1.0
  dtype: bfloat16
  checkpoint_schedule: log_linear
  checkpoint_count: 20
  checkpoint_log_linear_alpha: 0.5
  hf_upload_checkpoints: false
