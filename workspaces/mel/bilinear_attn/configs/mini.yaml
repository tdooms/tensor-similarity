name: big_experiment
seed: 42

model:
  vocab_size: 8
  n_ctx: 16
  d_model: 8
  n_head: 2
  n_layers: 2
  attn_type: quadratic
  attn_scale: 0.35
  rope_base: 10000
  norm_type: none
  norm_places: [pre_unembed]
  use_rmsnorm_qk: false
  use_bias_qk: false
init:
  init_type: mup
  std_embed: 0.02
  std_o: 0.01
  std_qkv: 0.02
train:
  batch_size: 128
  betas:
  - 0.9
  - 0.95
  checkpoint_every: 500
  debug: true
  dtype: bfloat16
  eval_every: 100
  grad_clip: 1.0
  lr: 0.0003
  lr_decay_frac: 0.25
  max_steps: 1000
  muon_lr: 0.02
  use_muon: true
  warmup_steps: 500
  weight_decay: 0.1
loss:
  type: next_token_ce
  label_smoothing: 0.0
