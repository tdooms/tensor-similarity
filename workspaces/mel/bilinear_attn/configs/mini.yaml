name: mini_induction_checkpoints
seed: 42

model:
  vocab_size: 16
  n_ctx: 8
  d_model: 8
  n_head: 2
  n_layers: 2
  attn_type: quadratic
  attn_scale: 0.35
  rope_base: 1000
  norm_type: none
  norm_places: []
  use_rmsnorm_qk: false
  use_bias_qk: false

init:
  std_embed: 0.02
  std_qkv: 0.02
  std_o: 0.01
  init_type: mup


train:
  batch_size: 64
  lr: 3.0e-4
  muon_lr: 0.02
  use_muon: true
  betas: [0.9, 0.95]
  weight_decay: 0.1
  max_steps: 15000
  warmup_steps: 500
  lr_decay_frac: 0.2
  grad_clip: 1.0
  dtype: bfloat16
  debug: true
  eval_every: 100
  checkpoint_every: 100000

loss:
  type: next_token_ce
  label_smoothing: 0.0