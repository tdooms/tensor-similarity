[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensor-mars"
version = "0.1.0"
description = "Never gonna give you up!"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "torch>=2.10,<3",
    "torchvision>=0.25,<1",
    "triton>=3.6,<4; sys_platform == 'linux'",
    "polars>=1.40,<2",
    "pandas>=3.0,<4",
    "numpy>=2.3,<3",
    "einops>=0.8,<1",
    "opt-einsum>=3.4,<4",
    "cotengra>=0.7,<1",
    "jaxtyping>=0.3,<1",
    "tqdm>=4.67,<5",
    "huggingface-hub>=1.3,<2",
    "safetensors>=0.7,<1",
    "datasets>=4.5,<5",
    "transformers>=5.0,<6",
    "tokenizers>=0.22,<1",
    "wandb>=0.24,<1",
    "numba>=0.63,<1",
    "quimb>=1.12,<2",
    "kornia>=0.8,<1",
    "bidict>=0.23,<1",
    "scikit-learn>=1.8,<2",
    "matplotlib>=3.10,<4",
    "plotly>=6.5,<7",
    "kaleido==0.2.1",
    "kahypar>=1.3.7",
    "optuna>=4.8,<5",
    "loguru>=0.7.3",
]

[project.scripts]
train   = "src.figures.cli:train_main"
prepare = "src.figures.cli:prepare_main"
plot    = "src.figures.cli:plot_main"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyter",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "artifacts", "_downloads", "workspaces"]
markers = [
    "slow: realistic-scale tests; not run by default. Use `pytest -m slow`.",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
